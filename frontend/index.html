<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmHealth AI</title>
  <meta name="description" content="AI-powered crop health monitoring from drone imagery">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="panels.css">
</head>
<body>

  <header class="app-header">
    <h1>🌾 FarmHealth AI</h1>
    <p class="tagline tagline-local" id="tagline-local" data-i18n="tagline"></p>
    <p class="tagline tagline-en">AI-powered crop health monitoring from drone imagery</p>
  </header>

  <div class="layout">

    <!-- Top-left corner -->
    <aside class="card panel" id="panel-discoveries" aria-labelledby="disc-title">
      <h2 id="disc-title" data-i18n="disc_title"></h2>
      <div id="discoveries-list"></div>
    </aside>

    <!-- Centre: your existing field analysis (unchanged) -->
    <main class="container">

      <!-- Step 1: Language -->
      <section class="card" aria-labelledby="step-lang">
        <h2 id="step-lang"><span class="step">1</span> <span data-i18n="step_lang"></span></h2>
        <p class="current-lang"><span data-i18n="current"></span> <strong id="current-lang-name"></strong></p>
        <label for="lang-select" class="field-label lang-question" data-i18n="q_lang"></label>
        <select id="lang-select" aria-label="Select language"></select>
      </section>

      <!-- Step 2: Upload -->
      <section class="card" aria-labelledby="step-upload">
        <h2 id="step-upload"><span class="step">2</span> <span data-i18n="step_upload"></span></h2>
        <label for="file-input" class="upload-area">
          <span class="upload-icon" aria-hidden="true">📷</span>
          <span class="upload-title"></span>
          <span class="upload-hint" data-i18n="hint"></span>
        </label>
        <input type="file" id="file-input" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
      </section>

      <!-- Step 3: Analyze -->
      <section class="card" aria-labelledby="step-analyze">
        <h2 id="step-analyze"><span class="step">3</span> <span data-i18n="step_analyze"></span></h2>
        <button type="button" id="analyze-btn" class="btn btn-primary" data-i18n="btn_analyze"></button>

        <div id="loading" role="status" aria-live="polite" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <p class="loading-text" data-i18n="loading"></p>
        </div>
      </section>

      <!-- Results -->
      <section class="card" aria-labelledby="results-map">
        <h2 id="results-map" data-i18n="map_title"></h2>
        <img id="overlay-img" data-i18n-alt="map_alt" alt="">
        <p class="placeholder-note" id="map-placeholder" data-i18n="map_ph"></p>

        <div id="legend" data-i18n-aria="legend_aria">
          <div class="legend-item"><span class="swatch swatch-c0" aria-hidden="true"></span><span data-i18n="l0"></span></div>
          <div class="legend-item"><span class="swatch swatch-c1" aria-hidden="true"></span><span data-i18n="l1"></span></div>
          <div class="legend-item"><span class="swatch swatch-c2" aria-hidden="true"></span><span data-i18n="l2"></span></div>
          <div class="legend-item"><span class="swatch swatch-c3" aria-hidden="true"></span><span data-i18n="l3"></span></div>
          <div class="legend-item"><span class="swatch swatch-c4" aria-hidden="true"></span><span data-i18n="l4"></span></div>
          <div class="legend-item"><span class="swatch swatch-c5" aria-hidden="true"></span><span data-i18n="l5"></span></div>
        </div>
      </section>

      <section class="card" aria-labelledby="results-chart">
        <h2 id="results-chart" data-i18n="stats_title"></h2>
        <div class="chart-wrap">
          <canvas id="stats-chart" role="img" data-i18n-aria="chart_aria"></canvas>
        </div>
      </section>

      <section class="card" aria-labelledby="results-summary">
        <h2 id="results-summary" data-i18n="sum_title"></h2>
        <div id="summary-text" aria-live="polite"></div>

        <h3 class="audio-heading" data-i18n="listen"></h3>
        <audio id="audio-player" controls></audio>

        <div class="btn-row">
          <button type="button" id="read-btn" class="btn btn-secondary" data-i18n="read"></button>
          <button type="button" id="stop-btn" class="btn btn-outline" data-i18n="stop"></button>
        </div>
      </section>

    </main>

    <!-- Top-right corner -->
    <aside class="card panel" id="panel-prices" aria-labelledby="price-title">
      <h2 id="price-title" data-i18n="price_title"></h2>
      <p id="price-status" class="note"></p>
      <div id="price-list"></div>
      <p id="price-unit" class="note"></p>
    </aside>

    <!-- Bottom-left corner -->
    <aside class="card panel" id="panel-facts" aria-labelledby="facts-title">
      <h2 id="facts-title" data-i18n="facts_title"></h2>
      <div id="facts-list"></div>
    </aside>

    <!-- Bottom-right corner -->
    <aside class="card panel" id="panel-chat" aria-labelledby="chat-title">
      <h2 id="chat-title" data-i18n="chat_title"></h2>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <input type="text" id="chat-input" autocomplete="off">
        <button type="submit" class="btn btn-primary" data-i18n="chat_send"></button>
      </form>
    </aside>

  </div>

  <footer class="app-footer">
    <p>FarmHealth AI 🌱</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="i18n.js"></script>
  <script src="panels-i18n.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="panels.js"></script>
</body>
</html>
